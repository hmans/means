[env]
_.file = { path = ".env", redact = true }

[tools]
go = "latest"
goreleaser = "2.18.2"

[tasks.means]
description = "Run the means CLI from source"
dir = "{{ cwd }}"
run = 'go run "{{ config_root }}"'
raw_args = true
raw = true

[tasks.sweet]
description = "Run Sweet Release 0.3.0 (forwards CLI arguments)"
dir = "{{ config_root }}"
run = "go run github.com/chattocorp/sweet-release/apps/sweet/cmd/sweet@fc9e0dea13c61edf7bdd0a04a21eca0f68a72e35"
raw_args = true

[tasks."release:check"]
description = "Validate the release archive configuration"
run = "goreleaser check"

[tasks."release:snapshot"]
description = "Test and build release archives without publishing"
run = "goreleaser release --snapshot --clean"

[tasks.deploy]
description = "Build and install means into ~/.local/bin"
dir = "{{ config_root }}"
run = 'GOBIN="$HOME/.local/bin" go install .'

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."
raw_args = true
