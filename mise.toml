[tools]
go = "latest"

[tasks.means]
description = "Run the means CLI from source"
dir = "{{ cwd }}"
run = 'go run "{{ config_root }}"'
raw_args = true

[tasks.deploy]
description = "Build and install means into ~/.local/bin"
dir = "{{ config_root }}"
run = 'GOBIN="$HOME/.local/bin" go install .'

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."
raw_args = true

[tasks.issues-mcp]
description = "Serve the means project's issue collection over MCP"
dir = "{{ config_root }}"
run = "go run . mcp --path ./issues --json"
raw = true
