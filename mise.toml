[tools]
go = "latest"

[tasks.means]
description = "Run the means CLI from source"
dir = "{{ cwd }}"
run = 'go run "{{ config_root }}"'
raw_args = true

[tasks.test]
description = "Run the Go test suite"
run = "go test ./..."
raw_args = true

[tasks.issues-mcp]
description = "Serve the means project's issue collection over MCP"
dir = "{{ config_root }}"
run = "go run . mcp --path ./issues --json"
raw = true
