version: 2
project_name: means

before:
  hooks:
    - go test ./...
    - go vet ./...

builds:
  - id: means
    main: .
    binary: means
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: means
    description: Manage Markdown collections with typed frontmatter and local schemas
    homepage: https://github.com/hmans/means
    # The workflow publishes this exact file after the release assets are available.
    skip_upload: true
    repository:
      owner: hmans
      name: homebrew-tap
    url:
      template: "https://github.com/hmans/means/releases/download/v{{ .Version }}/{{ .ArtifactName }}"
    binaries: [means]
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/means"]
          end

snapshot:
  version_template: '{{ if index .Env "RELEASE_VERSION" }}{{ .Env.RELEASE_VERSION }}{{ else }}0.0.0-SNAPSHOT-{{ .ShortCommit }}{{ end }}'

# This repository's tag-triggered workflow owns release notes and publication.
changelog:
  disable: true
