version: 2
project_name: means

before:
  hooks:
    - go test ./...
    - go vet ./...

builds:
  - id: means
    main: .
    binary: means
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "0.0.0-SNAPSHOT-{{ .ShortCommit }}"

# Keep changelog processing enabled: --release-notes supplies the Sweet notes
# and skips automatic generation. Disabling it also skips loading those notes.

release:
  name_template: "means {{ .Version }}"
  # The workflow publishes only after all asset uploads succeed.
  draft: true
  prerelease: auto
