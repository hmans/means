name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Read release version and notes
        run: |
          version=${TAG#v}
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          go run github.com/chattocorp/sweet-release/apps/sweet/cmd/sweet@fc9e0dea13c61edf7bdd0a04a21eca0f68a72e35 \
            changelog --version "$version" -- . > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.2
          args: release --snapshot --clean
      - name: Verify archives
        run: |
          test "$(dist/means_linux_amd64_v1/means version)" = "means $RELEASE_VERSION"
          (cd dist && sha256sum --check checksums.txt)
      - name: Publish GitHub Release
        run: |
          state=$(gh release view "$TAG" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo missing)
          if [[ "$state" == published ]]; then
            echo "$TAG is already published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Recreate a draft left by a failed upload. Keep the tag.
          if [[ "$state" == draft ]]; then gh release delete "$TAG" --yes; fi
          options=()
          if [[ "${RELEASE_VERSION%%+*}" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/checksums.txt dist/homebrew/Casks/means.rb \
            --verify-tag --title "means $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${options[@]}"
          echo "Published $TAG." >> "$GITHUB_STEP_SUMMARY"

  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Different release tags must not update the tap at the same time.
    concurrency:
      group: homebrew-means
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check tap credentials
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$TAP_TOKEN" ]]; then
            echo '::error::Set HOMEBREW_TAP_TOKEN with Contents read/write access to the Homebrew tap.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          repository: hmans/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update tap from published release
        run: |
          set -euo pipefail
          version=${TAG#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # Use the published cask, never checksums from a retry's rebuilt binaries.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern means.rb --dir "$RUNNER_TEMP/homebrew"
          cask="$RUNNER_TEMP/homebrew/means.rb"
          grep -Fqx "  version \"$version\"" "$cask"
          if [[ -f Casks/means.rb ]]; then
            current=$(sed -n 's/^  version "\([^"]*\)"$/\1/p' Casks/means.rb)
            [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            newest=$(printf '%s\n' "$version" "$current" | sort -V | tail -1)
            if [[ "$newest" != "$version" ]]; then
              echo "Tap already contains newer means $current; skipped $TAG." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          mkdir -p Casks
          cp "$cask" Casks/means.rb
          git add Casks/means.rb
          if git diff --cached --quiet; then
            echo "Tap already contains $TAG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update means to $version"
          git push
          echo "Published means $version to Homebrew." >> "$GITHUB_STEP_SUMMARY"
