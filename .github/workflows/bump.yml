name: Bump

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    uses: chattocorp/sweet-release/.github/workflows/bump.yml@7e3acbc56982d381442bfba2cf9b4e3ac6732c89
    with:
      sweet-version: sweet@0.3.0
    secrets:
      release-token: ${{ secrets.RELEASE_PR_TOKEN }}
