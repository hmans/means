name: Bump

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    # Repin to the merged revision before this draft PR is ready.
    uses: chattocorp/sweet-release/.github/workflows/bump.yml@0283db403e6641e3a1ec02a59951740775e02a91
    secrets:
      release-token: ${{ secrets.RELEASE_PR_TOKEN }}
