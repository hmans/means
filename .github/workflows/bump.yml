name: Bump

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    uses: chattocorp/sweet-release/.github/workflows/bump.yml@ccee4355cc84229bf23b3f6dfd9658dd21672cba
    with:
      sweet-version: sweet@0.3.0
    secrets:
      release-token: ${{ secrets.RELEASE_PR_TOKEN }}
