name: Bump

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    uses: chattocorp/sweet-release/.github/workflows/bump.yml@1c210fb375b8823d385bfb9cfe67ea261a2fbeca
    with:
      sweet-version: sweet@0.3.0
    secrets:
      release-token: ${{ secrets.RELEASE_PR_TOKEN }}
