name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Each main push has a release range that must reach tagging.
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...

  tag:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    # Repin to the merged revision before this draft PR is ready.
    uses: chattocorp/sweet-release/.github/workflows/tag.yml@0283db403e6641e3a1ec02a59951740775e02a91
    secrets:
      release-token: ${{ secrets.RELEASE_PR_TOKEN }}

