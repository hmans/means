name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Each main push has a release range that must reach tagging.
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...

  release:
    needs: check
    permissions:
      contents: write
    uses: chattocorp/sweet-release/.github/workflows/release.yml@318cdc4bf2adee88d437c9557733a7a0963a8540
    with:
      github-release: true
      goreleaser: v2.18.2

